<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早押しボタン</title>
    <style>
        body { text-align: center; font-family: sans-serif; padding-top: 50px; background-color: #f5f5f5; }
        #buzzer {
            width: 250px; height: 250px; border-radius: 50%;
            background-color: #f44336; color: white; font-size: 32px; font-weight: bold;
            border: none; box-shadow: 0 10px #b71c1c; cursor: pointer;
            transition: all 0.1s ease;
        }
        #buzzer:active:not(:disabled) { box-shadow: 0 2px #b71c1c; transform: translateY(8px); }
        #buzzer:disabled {
            background-color: #9e9e9e !important;
            box-shadow: 0 10px #616161 !important;
            cursor: not-allowed;
            opacity: 0.6;
        }
        #status-message { font-size: 24px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>イントロドン！回答者画面</h1>
    
    <input type="text" id="username" placeholder="名前を入力してください" style="font-size: 20px; padding: 8px; margin-bottom: 30px; border-radius: 5px; border: 1px solid #ccc;"><br>
    
    <button id="buzzer" disabled>WAIT</button>
    
    <div id="status-message" style="color: #616161;">ホストが曲を流すのを待っています...</div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="player.js"></script>
</body>
</html>
