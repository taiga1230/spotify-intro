<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イントロドン ホスト画面</title>
</head>
<body>
    <h1>イントロドン - ホスト用</h1>
    <button id="login-button">Spotifyでログイン</button>
    
    <div id="player-controls" style="display: none; margin-top: 20px;">
        <div id="action-controls" style="margin-bottom: 20px;">
            <button id="reset-button" style="font-size: 20px; padding: 12px 25px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">➔ 次の早押しを有効にする（回答者リセット）</button>
            <button id="correct-button" style="font-size: 18px; padding: 12px 20px; background-color: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 15px;">◯ 正解（曲名を表示）</button>
        </div>

        <h2 id="winner-display" style="color: red; font-size: 40px; margin-top: 30px; min-height: 50px;"></h2>

        <div id="answer-panel" style="display: none; background-color: #e3f2fd; padding: 20px; border-radius: 8px; margin-top: 20px; border: 2px solid #2196F3;">
            <h3 style="margin: 0; color: #0d47a1;">【現在の曲情報】</h3>
            <p id="track-info-display" style="font-size: 28px; font-weight: bold; margin: 10px 0; color: #333;"></p>
            <button id="close-answer-button" style="font-size: 16px; padding: 5px 15px; background-color: #616161; color: white; border: none; border-radius: 4px; cursor: pointer;">曲名表示を閉じる</button>
        </div>

        <hr style="margin-top: 40px;">
        
        <div style="margin-top: 20px; text-align: center;">
            <h3>スマホから参加！</h3>
            <div id="qrcode-area"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script src="app.js"></script>
</body>
</html>
